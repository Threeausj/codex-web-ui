# Base deployment: the application has no published ports.
# Add compose.local.yaml for loopback HTTP or compose.public.yaml for Caddy HTTPS.
services:
  app:
    image: codex-web-ui:local
    build:
      context: .
      args:
        CODEX_VERSION: ${CODEX_VERSION:-0.159.2}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8787"
      CODEX_WEB_PASSWORD: ${CODEX_WEB_PASSWORD:?Set CODEX_WEB_PASSWORD in .env.docker to at least 12 characters}
      PUBLIC_ORIGIN: http://127.0.0.1:8787,http://localhost:8787
      TRUST_PROXY: "0"
      DATA_DIR: /app/data
      CODEX_HOME: /home/node/.codex
      CODEX_BIN: codex
      CODEX_CONNECTION_MODE: spawn
      # Empty values use auto-generated keys persisted in the webdata volume.
      PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
      PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
      PUSH_SUBJECT: ${PUSH_SUBJECT:-}
    volumes:
      - webdata:/app/data
      - codexhome:/home/node/.codex
      - type: bind
        source: ${WORKSPACE_PATH:-./workspace}
        target: /workspace
        bind:
          create_host_path: false
    stop_grace_period: 20s

volumes:
  webdata:
  codexhome:
